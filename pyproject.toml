[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-h3-seqattn"
version = "0.4.4"
# comfy-cli publishes this field as the Comfy Registry node description.
description = "**MiniMax H3 SeqAttn brings long-sequence MiniMax-H3 generation to low-VRAM ComfyUI setups.** By streaming long-sequence activations through CPU memory and processing attention and MLPs in fixed-size GPU tiles, **denoising VRAM stays bounded instead of growing with sequence length**. The checked-in 8 GiB validation belongs to version 0.4.0's fused DiT path and retired Qwen offload implementation; it is not a Qwen SeqAttn performance claim."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "renlililoli"}]
keywords = ["comfyui", "minimax-h3", "attention", "low-vram", "video"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "seqattn-core[dit,sparse] @ https://github.com/renlililoli/stream-attn/archive/d8c51ef1e347d76f237478949679a976d8179bde.tar.gz",
  "tomli>=1.1; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/renlililoli/minimax-h3-seq-chunk-attn"
Documentation = "https://github.com/renlililoli/minimax-h3-seq-chunk-attn/tree/community/comfyui-minimax-h3-seqattn"
Issues = "https://github.com/renlililoli/minimax-h3-seq-chunk-attn/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.9"]

[tool.comfy]
PublisherId = "renlililoli"
DisplayName = "MiniMax H3 SeqAttn"
Icon = ""
requires-comfyui = "==0.30.0"

[tool.setuptools.packages.find]
include = ["comfyui_seqattn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
