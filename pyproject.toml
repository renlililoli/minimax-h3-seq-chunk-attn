[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-h3-seqattn"
version = "0.1.0"
description = "Exact CPU-backed SeqAttn for native ComfyUI MiniMax-H3 models"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt"]
authors = [{name = "renlililoli"}]
keywords = ["comfyui", "minimax-h3", "attention", "low-vram", "video"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Repository = "https://github.com/renlililoli/minimax-h3-seq-chunk-attn"
Documentation = "https://github.com/renlililoli/minimax-h3-seq-chunk-attn/tree/community/comfyui-minimax-h3-seqattn"
Issues = "https://github.com/renlililoli/minimax-h3-seq-chunk-attn/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.9"]

[tool.comfy]
PublisherId = "renlililoli"
DisplayName = "MiniMax H3 SeqAttn"
Icon = ""
requires-comfyui = ">=0.30.0"

[tool.setuptools.packages.find]
include = ["comfyui_seqattn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["comfyui_seqattn/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
