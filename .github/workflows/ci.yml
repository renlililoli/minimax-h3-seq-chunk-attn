name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      COMFYUI_COMMIT: 9a9fdb10ed144ce760d9682cb247526ea23cc525
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch torchvision torchaudio

      - name: Install ComfyUI and test dependencies
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/Comfy-Org/ComfyUI.git ComfyUI
          git -C ComfyUI fetch --depth 1 origin "$COMFYUI_COMMIT"
          git -C ComfyUI checkout --detach "$COMFYUI_COMMIT"
          test "$(git -C ComfyUI rev-parse HEAD)" = "$COMFYUI_COMMIT"
          python -m pip install -r ComfyUI/requirements.txt
          python -m pip install -e '.[dev]'

      - name: Static checks
        run: |
          ruff check __init__.py comfyui_seqattn tests
          python -m build

      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/ComfyUI:${{ github.workspace }}
        run: pytest -q
